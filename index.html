<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A German fill-in-the-blank game for English speakers." />
    <title>German in the Glow</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <canvas id="aquarium" aria-hidden="true"></canvas>
    <canvas id="starfield" aria-hidden="true" hidden></canvas>
    <button id="effects-toggle" class="effects-toggle" type="button" aria-label="Starfield mode" aria-pressed="false" title="Switch to starfield">
      <span class="effects-toggle-thumb" aria-hidden="true"></span>
      <span class="effects-toggle-label" aria-hidden="true">Aquarium</span>
    </button>
    <main class="game-shell">
      <p id="score" class="score" hidden>Correct answers: <span id="correct-count">0</span>/<span id="total-count">0</span></p>
      <section class="game-card" aria-labelledby="sentence" aria-describedby="status">
        <p id="translation" class="translation" lang="en" hidden></p>
        <h1 id="sentence" class="sentence" lang="de"></h1>
        <div id="options" class="options" role="group" aria-label="Answer options"></div>
        <div class="answer-area">
          <div id="status" class="status" aria-live="polite" aria-atomic="true"></div>
        </div>
      </section>
    </main>
    <script type="module" src="main.js"></script>
  </body>
</html>
